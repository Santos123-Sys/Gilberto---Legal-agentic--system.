name: Verify contract review workflow
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      OTEL_SDK_DISABLED: 'true'
      LITELLM_LOCAL_MODEL_COST_MAP: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      - run: python -m unittest discover -s tests -v
        working-directory: backend
  backup-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
        working-directory: backup_gateway
      - run: python -m unittest discover -s tests -v
        working-directory: backup_gateway
      - run: docker build -t gilberto-backup-gateway-smoke .
        working-directory: backup_gateway
  staging-smoke:
    if: github.head_ref == 'security/phase2-staging-security-smoke-20261029'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python scripts/staging_smoke.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run test:local
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      # Check the real Railway nginx container and templated same-origin API proxy.
      - run: docker build --build-arg VITE_AUTH_MODE=local -f Dockerfile -t gilberto-nginx-proxy-check .
        working-directory: frontend
      - run: docker run --rm -e PORT=8080 -e GILBERTO_API_UPSTREAM=http://127.0.0.1:8000 -e GILBERTO_PROXY_SECRET=ci-fixture-long-not-a-production-secret gilberto-nginx-proxy-check nginx -t
